<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>floating</title>
  </head>
  <body>
    <div id="info">
      <img id="info-icon" />
      <div id="info-text">
        <ul>
          <h4>MOUSE CONTROLS</h4>
          <li>✦ left ⇢ rotate</li>
          <li>✦ middle/scroll ⇢ zoom</li>
          <li>✦ right ⇢ pan</li>
          <br />
          <h4>KEYS</h4>
          <li>✦ i ⇢ toggle instructions</li>
          <li>✦ b ⇢ toggle bubble</li>
          <li>✦ space ⇢ toggle auto-rotate</li>
        </ul>
      </div>
    </div>
    <canvas class="webgl"></canvas>
  </body>
</html>
